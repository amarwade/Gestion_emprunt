<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduLoan — Espace Étudiant & PC disponibles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/dashboard.css?v=5" />
  <link rel="stylesheet" href="css/theme.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a href="index.html" class="brand" aria-label="EduLoan, accueil">
        <img class="brand-logo" src="assets/images/logo.png" alt="" />
      </a>

      <!-- Navigation Étudiant simplifiée selon les exigences -->
      <div class="nav-section">
        <div class="nav-label">Espace étudiant</div>
        <a class="nav-item active-parent" href="#pcs" data-nav="pcs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 19h8"/></svg>
          PC disponibles
        </a>
        <a class="nav-item" href="#emprunts" data-nav="emprunts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 4v4h8V4M8 12h8M8 16h5"/></svg>
          Mes emprunts
        </a>
      </div>

      <div class="nav-section" style="margin-top: auto; padding-top: 24px;">
        <button id="logout-btn" class="nav-item" style="background: none; border: none; width: 100%; text-align: left; cursor: pointer; color: #ef4444; font-family: inherit; font-size: inherit;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Déconnexion
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="top-left">
          <span style="font-weight: 600; font-size: 15px; color: #475569;" id="welcome-user">Bonjour</span>
        </div>
        <div class="top-right">
          <label class="search">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
            <input type="search" placeholder="Rechercher un PC, un ID…" />
          </label>
          <a href="demande-pret.html" class="new-request-btn">
            Nouvelle demande
          </a>
          <div class="avatar" role="img" aria-label="Profil" id="user-avatar">ET</div>
        </div>
      </header>

      <section class="content">
        <!-- Section PC disponibles -->
        <div class="pcs-area" id="pcs">
          <div class="section-head">
            <h2>PC disponibles</h2>
            <div class="filters" role="group" aria-label="Filtrer les PC">
                <button class="filter" type="button" data-filter="all">Tous</button>
                <button class="filter is-active" type="button" data-filter="disponible">Disponibles</button>
                <button class="filter" type="button" data-filter="en_attente">En attente</button>
                <button class="filter" type="button" data-filter="emprunte">Empruntés</button>
            </div>

            <div class="pc-grid" id="pc-grid" aria-live="polite">
              <p class="catalog-message">Chargement du catalogue…</p>
            </div>
        </div>

        <!-- Section Mes emprunts -->
        <aside class="loans-panel" id="emprunts">
          <div class="loans-head">
            <h2>Mes emprunts</h2>
          </div>

          <div class="loan-block">
            <h3>Demandes et historique</h3>
            <div class="loan-list" id="requests-container" aria-live="polite">Chargement des demandes…</div>
          </div>

          <div class="loan-block">
            <h3>Emprunts en cours</h3>
            <div class="loan-list" id="active-loans-container" aria-live="polite">Chargement des emprunts…</div>
          </div>

        </aside>
      </section>
    </main>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
