<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduLoan — Récupération de Mot de Passe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <img src="assets/images/logo.png" alt="EduLoan Logo" class="brand-logo-img" />
        </div>
        <div class="brand-name">EduLoan</div>
      </div>

      <div class="header-text">
        <h1>Récupération du Mot de Passe</h1>
        <p>Entrez vos informations pour retrouver votre mot de passe.</p>
      </div>

      <!-- Message d'erreur global -->
      <div class="alert alert-error" id="globalError" style="display: none;"></div>

      <!-- Message de succès -->
      <div class="alert alert-success" id="globalSuccess" style="display: none;"></div>

      <form id="forgot-password-form" novalidate>
        <!-- Identifiant -->
        <div class="form-group">
          <label for="student_id">Identifiant étudiant <span class="required">*</span></label>
          <input 
            type="text" 
            id="student_id" 
            name="student_id" 
            placeholder="Ex: 2026123"
            required 
          />
          <div class="field-error" id="error-student_id"></div>
        </div>

        <!-- Nom -->
        <div class="form-group">
          <label for="nom">Nom <span class="required">*</span></label>
          <input 
            type="text" 
            id="nom" 
            name="nom" 
            placeholder="Ex: Dupont" 
            required 
          />
          <div class="field-error" id="error-nom"></div>
        </div>

        <!-- Prénom -->
        <div class="form-group">
          <label for="prenom">Prénom <span class="required">*</span></label>
          <input 
            type="text" 
            id="prenom" 
            name="prenom" 
            placeholder="Ex: Jean" 
            required 
          />
          <div class="field-error" id="error-prenom"></div>
        </div>

        <!-- Bouton Récupérer -->
        <button type="submit" class="btn btn-primary" id="submitBtn">
          <span class="btn-text">Récupérer mon mot de passe</span>
          <span class="btn-loader" style="display: none;">
            <svg class="spinner" viewBox="0 0 50 50">
              <circle cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
            </svg>
          </span>
        </button>
      </form>

      <!-- Lien vers connexion -->
      <div class="register-link">
        <p><a href="/login.html">← Retour à la connexion</a></p>
      </div>
    </div>
  </div>

  <script src="js/forgot-password.js"></script>
</body>
</html>
