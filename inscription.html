<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduLoan — Inscription Étudiant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/inscription.css" />
</head>
<body>
  <div class="register-container">
    <div class="register-card">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <img src="assets/images/logo.png" alt="EduLoan Logo" class="brand-logo-img" />
        </div>
        <div class="brand-name">EduLoan</div>
      </div>

      <div class="header-text">
        <h1>Inscription Étudiant</h1>
        <p>Créez votre compte pour réserver des PC portables à l'école.</p>
      </div>

      <form id="register-form" novalidate>
        <!-- Nom -->
        <div class="form-group">
          <label for="nom">Nom <span class="required">*</span></label>
          <input type="text" id="nom" name="nom" placeholder="Ex: Dupont" autocomplete="family-name" required />
          <div class="field-error" id="error-nom"></div>
        </div>

        <!-- Prénom -->
        <div class="form-group">
          <label for="prenom">Prénom <span class="required">*</span></label>
          <input type="text" id="prenom" name="prenom" placeholder="Ex: Jean" autocomplete="given-name" required />
          <div class="field-error" id="error-prenom"></div>
        </div>

        <!-- Identifiant étudiant -->
        <div class="form-group">
          <label for="student_id">Identifiant étudiant <span class="required">*</span></label>
          <input type="text" id="student_id" name="student_id" placeholder="Ex: 2026123" maxlength="7" required />
          <small class="helper-text">Format attendu : 2026XXX (Année courante + 3 chiffres)</small>
          <div class="field-error" id="error-student_id"></div>
        </div>

        <!-- Mot de passe -->
        <div class="form-group">
          <label for="password">Mot de passe <span class="required">*</span></label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" placeholder="Votre mot de passe" autocomplete="new-password" required />
            <button type="button" class="toggle-password-btn" id="toggle-password" aria-label="Afficher ou masquer le mot de passe">
              <svg class="eye-icon" id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <div class="field-error" id="error-password"></div>
        </div>

        <!-- Message d'erreur / succès global -->
        <div class="alert-box error" id="global-error" style="display: none;" role="alert"></div>
        <div class="alert-box success" id="global-success" style="display: none;" role="status"></div>

        <!-- Bouton de soumission -->
        <button type="submit" class="submit-btn" id="submit-btn">
          <span>Créer mon compte</span>
        </button>

        <!-- Pied de formulaire -->
        <div class="form-footer">
          <span>Déjà inscrit ?</span>
          <a href="login.html" class="link-login">Se connecter</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/inscription.js"></script>
</body>
</html>
