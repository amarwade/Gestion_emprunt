name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  docker-build:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build de l'image (vérifie que le Dockerfile + le site sont valides)
        run: docker build -t emprunt-ordinateurs:${{ github.sha }} .

      - name: Test rapide - le conteneur répond bien
        run: |
          docker run -d --name test-app -p 8080:80 emprunt-ordinateurs:${{ github.sha }}
          sleep 2
          curl -f http://localhost:8080 || (docker logs test-app && exit 1)
          docker stop test-app

